<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart – Zabiha Beef</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
.top-brand{background:#b10f0f;color:#fff;padding:16px;font-size:24px;font-weight:bold;text-align:center;}
.cart-container{max-width:800px;margin:25px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,0.15);}
.cart-container h2{margin-top:0;color:#b10f0f;border-bottom:2px solid #eee;padding-bottom:10px;}
.cart-item{padding:15px 0;border-bottom:1px solid #eee;}
.cart-item strong{font-size:16px;}
.cart-item span{display:block;color:#555;font-size:14px;margin-top:4px;}
.qty-box{display:flex;gap:6px;align-items:center;margin-top:6px;}
.qty-box button{background:#333;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;}
.qty{min-width:30px;text-align:center;font-weight:bold;}
.total{text-align:right;font-size:18px;font-weight:bold;margin-top:20px;}
.return-btn{display:inline-block;margin-top:25px;background:#333;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;}
.order-btn{margin-top:20px;background:#b10f0f;color:#fff;border:none;padding:12px 22px;font-size:16px;border-radius:6px;cursor:pointer;}
.popup-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;}
.popup-box{background:#fff;width:280px;border-radius:8px;text-align:center;padding:15px;}
.popup-box h3{margin:0 0 10px;color:#b10f0f;}
.popup-box button{width:100%;margin-top:8px;padding:8px;background:#b10f0f;color:#fff;border:none;border-radius:5px;cursor:pointer;}
.popup-box textarea{
  width:100%;
  height:70px;
  padding:8px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:4px;
  resize:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="top-brand">ZABIHA BEEF – CART</div>

<div class="cart-container">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <div class="total" id="totalAmount"></div>
  <a href="index.html" class="return-btn">← Return to Main Menu</a><br>
  <button class="order-btn" onclick="placeOrder()">Place Order</button>
</div>

<!-- PAYMENT -->
<div class="popup-bg" id="paymentPopup">
  <div class="popup-box">
    <h3>Select Payment</h3>
    <button onclick="choosePayment('Cash on Delivery')">Cash on Delivery</button>
    <button onclick="choosePayment('Card Payment')">Card Payment</button>
  </div>
</div>

<!-- LOGIN -->
<div class="popup-bg" id="loginPopup">
  <div class="popup-box">
    <h3>Login Required</h3>
    <button onclick="goToLogin()">Continue</button>
  </div>
</div>

<!-- ADDRESS -->
<div class="popup-bg" id="addressPopup">
  <div class="popup-box">
    <h3>Delivery Address</h3>
    <textarea id="address" placeholder="Enter full delivery address"></textarea>
    <button onclick="confirmOrder()">Confirm Order</button>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartBox=document.getElementById("cartItems");
const totalBox=document.getElementById("totalAmount");

function isDealItem(n){return n.toLowerCase().includes("deal");}

function renderCart(){
  cartBox.innerHTML="";
  let total=0;
  if(cart.length===0){cartBox.innerHTML="<p>Your cart is empty.</p>";return;}
  cart.forEach((item,i)=>{
    total+=item.price*item.qty;
    cartBox.innerHTML+=`
    <div class="cart-item">
      <strong>${item.name}</strong>
      <span>Price: Rs ${item.price}</span>
      <div class="qty-box">
        <button onclick="changeQty(${i},-1)">−</button>
        <span class="qty">${item.qty}</span>
        <button onclick="changeQty(${i},1)">+</button>
      </div>
      <button onclick="removeItem(${i})"
      style="margin-top:8px;background:#b10f0f;color:#fff;border:none;padding:6px 12px;border-radius:4px;">
      Remove</button>
    </div>`;
  });
  totalBox.innerHTML="Total: Rs "+total;
}

function changeQty(i,d){
  let it=cart[i],s=isDealItem(it.name)?1:0.5;
  it.qty+=d*s;
  if(isDealItem(it.name)){if(it.qty<1)it.qty=1;it.qty=Math.round(it.qty);}
  else{if(it.qty<0.5)it.qty=0.5;it.qty=Math.round(it.qty*2)/2;}
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

function placeOrder(){
  if(cart.length===0){alert("Your cart is empty");return;}
  document.getElementById("paymentPopup").style.display="flex";
}

function choosePayment(m){
  localStorage.setItem("pendingPayment",m);
  document.getElementById("paymentPopup").style.display="none";

  if(localStorage.getItem("loggedIn")==="yes"){
    document.getElementById("addressPopup").style.display="flex";
  }else{
    document.getElementById("loginPopup").style.display="flex";
  }
}

function goToLogin(){
  window.location.href="login.html";
}

function confirmOrder(){
  const addr=document.getElementById("address").value.trim();
  if(!addr){alert("Please enter delivery address");return;}
  localStorage.setItem("deliveryAddress",addr);
  sendOrder();
}

function sendOrder(){
  let payment=localStorage.getItem("pendingPayment");
  let address=localStorage.getItem("deliveryAddress");
  if(!payment||!address)return;

  let msg="🛒 New Order – Zabiha Beef\n\n";
  msg+="Payment: "+payment+"\n";
  msg+="Address: "+address+"\n\n";

  let total=0;
  cart.forEach(i=>{
    msg+=`• ${i.name} x ${i.qty} = Rs ${i.price*i.qty}\n`;
    total+=i.price*i.qty;
  });
  msg+=`\nTotal: Rs ${total}`;

  localStorage.removeItem("cart");
  localStorage.removeItem("pendingPayment");
  localStorage.removeItem("deliveryAddress");

  window.open("https://wa.me/923074999091?text="+encodeURIComponent(msg),"_blank");
}

if(
  localStorage.getItem("loggedIn")==="yes" &&
  localStorage.getItem("pendingPayment")
){
  document.getElementById("addressPopup").style.display="flex";
}

renderCart();
</script>

</body>
</html>
