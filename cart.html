<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart – Zabiha Beef</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f5f5f5;
}

/* TOP BAR */
.top-brand{
  background:#b10f0f;
  color:#fff;
  padding:16px;
  font-size:24px;
  font-weight:bold;
  text-align:center;
}

/* CONTAINER */
.cart-container{
  max-width:800px;
  margin:25px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
  box-shadow:0 3px 8px rgba(0,0,0,0.15);
}

.cart-container h2{
  margin-top:0;
  color:#b10f0f;
  border-bottom:2px solid #eee;
  padding-bottom:10px;
}

/* ITEM */
.cart-item{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.cart-item strong{
  font-size:16px;
}

.cart-item span{
  display:block;
  color:#555;
  font-size:14px;
  margin-top:4px;
}

.qty-box{
  display:flex;
  gap:6px;
  align-items:center;
  margin-top:6px;
}

.qty-box button{
  background:#333;
  color:#fff;
  border:none;
  padding:4px 10px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.qty{
  min-width:30px;
  text-align:center;
  font-weight:bold;
}

/* TOTAL */
.total{
  text-align:right;
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
}

/* BUTTONS */
.return-btn{
  display:inline-block;
  margin-top:25px;
  background:#333;
  color:#fff;
  padding:10px 18px;
  border-radius:6px;
  text-decoration:none;
  font-size:14px;
}

.order-btn{
  margin-top:20px;
  background:#b10f0f;
  color:#fff;
  border:none;
  padding:12px 22px;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top-brand">ZABIHA BEEF – CART</div>

<div class="cart-container">
  <h2>Your Cart</h2>

  <div id="cartItems"></div>
  <div class="total" id="totalAmount"></div>

  <a href="index.html" class="return-btn">← Return to Main Menu</a><br>

  <button class="order-btn" onclick="placeOrder()">Place Order</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartBox = document.getElementById("cartItems");
const totalBox = document.getElementById("totalAmount");

function isDealItem(name){
  return name.toLowerCase().includes("deal");
}

function renderCart(){
  cartBox.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartBox.innerHTML = "<p>Your cart is empty.</p>";
    totalBox.innerHTML = "";
    return;
  }

  cart.forEach((item, index)=>{
    total += item.price * item.qty;

    cartBox.innerHTML += `
      <div class="cart-item">
        <strong>${item.name}</strong>
        <span>Price: Rs ${item.price}</span>

        <div class="qty-box">
          <button onclick="changeQty(${index},-1)">−</button>
          <span class="qty">${item.qty}</span>
          <button onclick="changeQty(${index},1)">+</button>
        </div>

        <button onclick="removeItem(${index})"
          style="margin-top:8px;background:#b10f0f;color:#fff;border:none;padding:6px 12px;border-radius:4px;">
          Remove
        </button>
      </div>
    `;
  });

  totalBox.innerHTML = "Total: Rs " + total;
}

function changeQty(index,dir){
  let item = cart[index];
  let step = isDealItem(item.name) ? 1 : 0.5;

  item.qty += dir * step;

  if(isDealItem(item.name)){
    if(item.qty < 1) item.qty = 1;
    item.qty = Math.round(item.qty);
  }else{
    if(item.qty < 0.5) item.qty = 0.5;
    item.qty = Math.round(item.qty * 2) / 2;
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function placeOrder(){
  if(cart.length === 0){
    alert("Your cart is empty");
    return;
  }

  let message = "🛒 New Order – Zabiha Beef\n\n";
  let total = 0;

  cart.forEach(item=>{
    message += `• ${item.name} x ${item.qty} = Rs ${item.price * item.qty}\n`;
    total += item.price * item.qty;
  });

  message += `\nTotal: Rs ${total}`;

  localStorage.setItem("hasOrderedBefore","yes");
  localStorage.removeItem("cart");

  window.open("https://wa.me/923074999091?text="+encodeURIComponent(message),"_blank");
  window.location.href="index.html";
}

renderCart();
</script>

</body>
</html>
